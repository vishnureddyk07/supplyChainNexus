name: CI

on:
  push  docker compose build:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest -r services/ingestion/requirements.txt

      - name: Lint
        run: |
          python -m flake8 services --max-line-length=160 --extend-ignore=E501

      - name: Run tests
        run: |
          python -m pytest

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose build