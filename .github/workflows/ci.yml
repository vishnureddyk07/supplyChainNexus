name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Flake8
        run: python -m flake8 services supplychain_nexus supplier-erp-mock tests

      - name: Check frontend types and production build
        working-directory: frontend
        run: |
          npm install
          npm run typecheck
          npm run build

  tests:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Tests
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Images
        run: docker compose build ingestion event-consumer application-api frontend sensor-simulator supplier-erp-mock

  health-check:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - uses: actions/checkout@v4

      - name: Start Containers
        run: docker compose up -d --build

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify end-to-end pipeline
        env:
          RUN_PIPELINE_INTEGRATION: "1"
        run: python -m pytest tests/integration -q

      - name: Container Status
        if: always()
        run: docker compose ps --all

      - name: Container Logs
        if: always()
        run: docker compose logs

      - name: Stop Containers
        if: always()
        run: docker compose down