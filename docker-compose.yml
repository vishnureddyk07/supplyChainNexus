services:
  postgres:
    image: postgres:16
    container_name: supplychain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-supplychain}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  flyway:
    image: flyway/flyway:10
    container_name: supplychain-flyway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-supplychain}
      FLYWAY_USER: ${POSTGRES_USER:-postgres}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./database/postgres/migrations:/flyway/sql:ro
      - ./database/postgres/migrations/flyway.conf:/flyway/conf/flyway.conf:ro
    command: ["-configFiles=/flyway/conf/flyway.conf", "migrate"]

  neo4j:
    image: neo4j:5
    container_name: supplychain-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      HEALTHCHECK_USER: ${NEO4J_USER:-neo4j}
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD:-password}
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -a bolt://localhost:7687 -u "$${HEALTHCHECK_USER}" -p
          "$${HEALTHCHECK_PASSWORD}" "RETURN 1" | grep -q 1
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: supplychain-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_HOST_PORT:-2181}:2181"
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 10"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: supplychain-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: supplychain-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_pub -h 127.0.0.1 -p 1883 -t supplychain/healthcheck -r -m ready
          && test "$$(mosquitto_sub -h 127.0.0.1 -p 1883 -t supplychain/healthcheck -C 1 -W 3)"
          = ready
      interval: 10s
      timeout: 5s
      retries: 12

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: supplychain-ingestion
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_STARTUP_TIMEOUT_SECONDS: ${DEPENDENCY_STARTUP_TIMEOUT_SECONDS:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INGESTION_READY_FILE: /tmp/ingestion-ready
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; raise SystemExit(0 if Path('/tmp/ingestion-ready').is_file() else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  event-consumer:
    build:
      context: .
      dockerfile: services/event_consumer/Dockerfile
    container_name: supplychain-event-consumer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-supplychain}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_STARTUP_TIMEOUT_SECONDS: ${DEPENDENCY_STARTUP_TIMEOUT_SECONDS:-120}
      DEPENDENCY_STARTUP_TIMEOUT_SECONDS: ${DEPENDENCY_STARTUP_TIMEOUT_SECONDS:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  application-api:
    build:
      context: .
      dockerfile: services/application_api/Dockerfile
    container_name: supplychain-application-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-supplychain}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      API_VIEWER_TOKEN: ${API_VIEWER_TOKEN:-}
      API_OPERATOR_TOKEN: ${API_OPERATOR_TOKEN:-}
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN:-}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      APP_ENV: ${APP_ENV:-development}
      SUPPLIER_RISK_LABEL_SOURCES: ${SUPPLIER_RISK_LABEL_SOURCES:-manual,audited}
      SUPPLIER_RISK_MODEL_PATH: /app/model-artifacts/supplier-risk-rf.skops
      SHIPMENT_DELAY_MODEL_PATH: /app/model-artifacts/shipment-delay.txt
      COMPOSITE_RISK_VERSION: ${COMPOSITE_RISK_VERSION:-composite-risk-v1}
      COMPOSITE_RISK_MINIMUM_COVERAGE: ${COMPOSITE_RISK_MINIMUM_COVERAGE:-0.5}
      SHIPMENT_DELAY_RISK_HORIZON_HOURS: ${SHIPMENT_DELAY_RISK_HORIZON_HOURS:-24}
      COMPOSITE_RISK_WEIGHTS: ${COMPOSITE_RISK_WEIGHTS:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - model_artifacts:/app/model-artifacts
    ports:
      - "${API_HOST_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: supplychain-frontend
    restart: unless-stopped
    depends_on:
      application-api:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:${API_HOST_PORT:-8001}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  demo-postgres:
    profiles: ["demo"]
    image: postgres:16
    container_name: supplychain-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DEMO_POSTGRES_USER:-supplychain_demo}
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD:-replace-with-a-demo-only-password}
      POSTGRES_DB: ${DEMO_POSTGRES_DB:-supplychain_demo}
    ports:
      - "${DEMO_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  demo-flyway:
    profiles: ["demo"]
    image: flyway/flyway:10
    container_name: supplychain-demo-flyway
    depends_on:
      demo-postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://demo-postgres:5432/${DEMO_POSTGRES_DB:-supplychain_demo}
      FLYWAY_USER: ${DEMO_POSTGRES_USER:-supplychain_demo}
      FLYWAY_PASSWORD: ${DEMO_POSTGRES_PASSWORD:-replace-with-a-demo-only-password}
    volumes:
      - ./database/postgres/migrations:/flyway/sql:ro
      - ./database/postgres/migrations/flyway.conf:/flyway/conf/flyway.conf:ro
    command: ["-configFiles=/flyway/conf/flyway.conf", "migrate"]

  demo-neo4j:
    profiles: ["demo"]
    image: neo4j:5
    container_name: supplychain-demo-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${DEMO_NEO4J_PASSWORD:-replace-with-a-demo-only-password}
      HEALTHCHECK_USER: ${NEO4J_USER:-neo4j}
      HEALTHCHECK_PASSWORD: ${DEMO_NEO4J_PASSWORD:-replace-with-a-demo-only-password}
    ports:
      - "${DEMO_NEO4J_HTTP_HOST_PORT:-7475}:7474"
      - "${DEMO_NEO4J_BOLT_HOST_PORT:-7688}:7687"
    volumes:
      - demo_neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -a bolt://localhost:7687 -u "$${HEALTHCHECK_USER}" -p
          "$${HEALTHCHECK_PASSWORD}" "RETURN 1" | grep -q 1
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s

  demo-seed:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: services/application_api/Dockerfile
    container_name: supplychain-demo-seed
    depends_on:
      demo-flyway:
        condition: service_completed_successfully
      demo-neo4j:
        condition: service_healthy
    environment:
      APP_ENV: development-demo
      DATABASE_URL: postgresql://${DEMO_POSTGRES_USER:-supplychain_demo}:${DEMO_POSTGRES_PASSWORD:-replace-with-a-demo-only-password}@demo-postgres:5432/${DEMO_POSTGRES_DB:-supplychain_demo}
      NEO4J_URI: bolt://demo-neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${DEMO_NEO4J_PASSWORD:-replace-with-a-demo-only-password}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["python", "-m", "services.demo.seed"]
    restart: "no"

  demo-model-trainer:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: services/application_api/Dockerfile
    container_name: supplychain-demo-model-trainer
    depends_on:
      demo-seed:
        condition: service_completed_successfully
    environment:
      APP_ENV: development-demo
      DATABASE_URL: postgresql://${DEMO_POSTGRES_USER:-supplychain_demo}:${DEMO_POSTGRES_PASSWORD:-replace-with-a-demo-only-password}@demo-postgres:5432/${DEMO_POSTGRES_DB:-supplychain_demo}
      SUPPLIER_RISK_LABEL_SOURCES: demo_synthetic
      SUPPLIER_RISK_DEVELOPMENT_DATA: "true"
      SHIPMENT_MODEL_DEVELOPMENT_DATA: "true"
      SUPPLIER_RISK_MODEL_PATH: /app/model-artifacts/supplier-risk-rf.skops
      SHIPMENT_DELAY_MODEL_PATH: /app/model-artifacts/shipment-delay.txt
    volumes:
      - demo_model_artifacts:/app/model-artifacts
    command: ["python", "-m", "services.demo.train_models"]
    restart: "no"

  demo-event-consumer:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: services/event_consumer/Dockerfile
    container_name: supplychain-demo-event-consumer
    restart: unless-stopped
    depends_on:
      demo-model-trainer:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      demo-neo4j:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DEMO_POSTGRES_USER:-supplychain_demo}:${DEMO_POSTGRES_PASSWORD:-replace-with-a-demo-only-password}@demo-postgres:5432/${DEMO_POSTGRES_DB:-supplychain_demo}
      NEO4J_URI: bolt://demo-neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${DEMO_NEO4J_PASSWORD:-replace-with-a-demo-only-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_GROUP: supplychain-demo-v1
      KAFKA_SUPPLIER_ID_PREFIX: demo-supplier-
      KAFKA_STARTUP_TIMEOUT_SECONDS: ${DEPENDENCY_STARTUP_TIMEOUT_SECONDS:-120}
      DEPENDENCY_STARTUP_TIMEOUT_SECONDS: ${DEPENDENCY_STARTUP_TIMEOUT_SECONDS:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  demo-api:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: services/application_api/Dockerfile
    container_name: supplychain-demo-api
    restart: unless-stopped
    depends_on:
      demo-model-trainer:
        condition: service_completed_successfully
      demo-neo4j:
        condition: service_healthy
    environment:
      APP_ENV: development-demo
      DATABASE_URL: postgresql://${DEMO_POSTGRES_USER:-supplychain_demo}:${DEMO_POSTGRES_PASSWORD:-replace-with-a-demo-only-password}@demo-postgres:5432/${DEMO_POSTGRES_DB:-supplychain_demo}
      NEO4J_URI: bolt://demo-neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${DEMO_NEO4J_PASSWORD:-replace-with-a-demo-only-password}
      CORS_ORIGINS: http://localhost:${DEMO_FRONTEND_HOST_PORT:-5174}
      API_VIEWER_TOKEN: ${API_VIEWER_TOKEN:-}
      API_OPERATOR_TOKEN: ${API_OPERATOR_TOKEN:-}
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN:-}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      SUPPLIER_RISK_LABEL_SOURCES: demo_synthetic
      SUPPLIER_RISK_MODEL_PATH: /app/model-artifacts/supplier-risk-rf.skops
      SHIPMENT_DELAY_MODEL_PATH: /app/model-artifacts/shipment-delay.txt
      COMPOSITE_RISK_VERSION: ${COMPOSITE_RISK_VERSION:-composite-risk-demo-v1}
      COMPOSITE_RISK_MINIMUM_COVERAGE: ${COMPOSITE_RISK_MINIMUM_COVERAGE:-0.5}
      SHIPMENT_DELAY_RISK_HORIZON_HOURS: ${SHIPMENT_DELAY_RISK_HORIZON_HOURS:-24}
      COMPOSITE_RISK_WEIGHTS: ${COMPOSITE_RISK_WEIGHTS:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      APP_MODE: development-demo
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - demo_model_artifacts:/app/model-artifacts:ro
    ports:
      - "${DEMO_API_HOST_PORT:-8002}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  demo-frontend:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: supplychain-demo-frontend
    restart: unless-stopped
    depends_on:
      demo-api:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:${DEMO_API_HOST_PORT:-8002}
    ports:
      - "${DEMO_FRONTEND_HOST_PORT:-5174}:5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  sensor-simulator:
    build:
      context: .
      dockerfile: services/sensor-simulator/Dockerfile
    container_name: supplychain-sensor-simulator
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      EVENT_INTERVAL: ${EVENT_INTERVAL:-5}
      SCENARIO_MODE: ${SCENARIO_MODE:-normal}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  supplier-erp-mock:
    build:
      context: .
      dockerfile: supplier-erp-mock/Dockerfile
    container_name: supplychain-supplier-erp
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    ports:
      - "${ERP_HOST_PORT:-8000}:8000"
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  neo4j_data:
  mosquitto_data:
  model_artifacts:
  demo_postgres_data:
  demo_neo4j_data:
  demo_model_artifacts:
