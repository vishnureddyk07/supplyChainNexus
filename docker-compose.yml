services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supplychain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supplychain"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:10
    container_name: flyway
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/postgres/migrations:/flyway/sql
      - ./database/postgres/flyway.conf:/flyway/conf/flyway.conf:ro
    command:
      - -configFiles=/flyway/conf/flyway.conf
      - migrate

  neo4j:
    image: neo4j:5
    container_name: neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - neo4j_data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ok"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  sensor-simulator:
    build:
      context: ./services/sensor-simulator
    container_name: sensor-simulator
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883

  supplier-erp-mock:
    build:
      context: ./supplier-erp-mock
    container_name: supplier-erp-mock
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: ingestion
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      kafka:
        condition: service_healthy
      supplier-erp-mock:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SUPPLIER_ERP_URL: http://supplier-erp-mock:8000
      INGESTION_ENV: local
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "8080:8080"

  redis:
    image: valkey/valkey:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  graph:
    build:
      context: .
      dockerfile: services/graph/Dockerfile
    container_name: graph
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/supplychain
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      GRAPH_MAX_RETRIES: ${GRAPH_MAX_RETRIES:-3}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8002:8000"

  risk-engine:
    build:
      context: .
      dockerfile: services/risk_engine/Dockerfile
    container_name: risk-engine
    restart: unless-stopped
    depends_on:
      graph:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/supplychain
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  genai-engine:
    build:
      context: .
      dockerfile: services/genai_engine/Dockerfile
    container_name: genai-engine
    restart: unless-stopped
    depends_on:
      risk-engine:
        condition: service_healthy
    environment:
      RISK_ENGINE_URL: http://risk-engine:8090
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8091/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  backend-api:
    build:
      context: .
      dockerfile: services/backend_api/Dockerfile
    container_name: backend-api
    restart: unless-stopped
    depends_on:
      risk-engine:
        condition: service_healthy
      genai-engine:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      RISK_ENGINE_URL: http://risk-engine:8090
      GENAI_ENGINE_URL: http://genai-engine:8091
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/supplychain
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
  neo4j_data:
  redis_data: